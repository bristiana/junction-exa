<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; connect-src 'self'">
<meta name="vali-api" content="">
<title>Vali</title>
<meta name="description" content="Vali reads the official Finnish pages for you, shows where every fact comes from, and fills the forms. You approve the last step.">
<link rel="stylesheet" href="style.css">
<script src="vendor/butler.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Vali</a>
  <div class="top-right">
    <a href="#/dashboard" class="link-btn" data-view="dashboard">Dashboard</a>
    <button type="button" id="to-errands" class="link-btn">Errands</button>
    <button type="button" id="to-whatsapp" class="link-btn">WhatsApp</button>
    <button type="button" id="to-details" class="link-btn">Details</button>
    <span class="by-exa">Search by <b>Exa</b></span>
    <div class="palette-picker">
      <button type="button" id="palette" class="palette-btn" aria-label="Vali's colours" aria-haspopup="menu"></button>
    </div>
  </div>
</header>

<p id="notice" class="notice" role="status" hidden></p>
<p id="announce" class="sr-only" aria-live="polite"></p>

<main>
  <section id="home" class="view home">
    <div class="hero-slot" data-slot="home"></div>
    <h1>New in Finland? Hand me the errand.</h1>
    <p class="sub">Bank accounts, Kela, saunas, cinema. Vali finds it with Exa, fills it in and books it. You just say yes.</p>
    <form id="ask" class="ask">
      <label class="sr-only" for="errand">Your errand</label>
      <input id="errand" type="text" maxlength="2000" autocomplete="off" enterkeyhint="send"
             placeholder="What do you need done?">
      <button type="button" id="mic" class="mic" aria-label="Speak your errand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1a7 7 0 0 0 6-6.9h-2Z"/></svg>
      </button>
      <button type="submit" class="btn go">Ask Vali</button>
    </form>
    <div id="examples" class="chips examples">
      <button type="button" class="chip">Bank account without a Finnish ID</button>
      <button type="button" class="chip">Book a sauna this Friday</button>
      <button type="button" class="chip">Cinema tickets for Saturday</button>
      <button type="button" class="chip">Kela benefits for students</button>
      <button type="button" class="chip">Register my new address</button>
    </div>
   <section id="errands" class="errands"></section>
  </section>

  <section id="working" class="view working" hidden></section>
  <section id="answer" class="view answer" hidden></section>
  <section id="hub" class="view hub" hidden></section>
  <section id="dashboard" class="view dashboard" hidden aria-label="Dashboard"></section>
</main>

<footer class="site-foot">
  <h2 class="section-title">How Vali uses Exa</h2>
  <dl id="exa-uses" class="exa-uses"></dl>
</footer>

<dialog id="trust" class="sheet" aria-labelledby="trust-title">
  <form method="dialog" class="sheet-head">
    <h2 id="trust-title">How Vali handles your details</h2>
    <button class="link-btn" aria-label="Close">Close</button>
  </form>
  <div id="trust-body"></div>
</dialog>

<dialog id="details" class="sheet" aria-labelledby="details-title">
  <form method="dialog" class="sheet-head">
    <h2 id="details-title">Your details</h2>
    <button class="link-btn" aria-label="Close">Close</button>
  </form>
  <div id="details-body"></div>
</dialog>

<dialog id="whatsapp" class="sheet" aria-labelledby="whatsapp-title">
  <form method="dialog" class="sheet-head">
    <h2 id="whatsapp-title">WhatsApp</h2>
    <button class="link-btn" aria-label="Close">Close</button>
  </form>
  <div id="whatsapp-body"></div>
</dialog>
</body>
</html>
