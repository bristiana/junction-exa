<!doctype html><html lang="en"><title>Claim form</title><body>
<form onsubmit="event.preventDefault(); document.querySelector('#result').textContent='Reference FC-1234'">
<label>Full name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label>Phone <input name="phone" type="tel"></label>
<label>Claim type <select name="kind"><option value="delay">Flight delay</option><option value="refund">Refund</option></select></label>
<fieldset><legend>Contact preference</legend><label><input type="radio" name="contact" value="email">Email contact</label><label><input type="radio" name="contact" value="phone">Phone contact</label></fieldset>
<label><input type="checkbox" name="terms">Accept terms</label>
<label>Details <textarea name="details"></textarea></label>
<button type="submit">Submit claim</button></form><p id="result"></p>
<script>document.querySelector('[name=name]').addEventListener('input',()=>document.body.dataset.inputEvent='yes'); document.querySelector('[name=name]').addEventListener('change',()=>document.body.dataset.changeEvent='yes');</script>
</body></html>
